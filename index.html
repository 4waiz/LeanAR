<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
  <!-- Prevent all caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>EDGE | 3D QR Scanner</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="video-container">
    <!-- Camera feed -->
    <div id="qr-reader">
      <video id="video" autoplay playsinline muted></video>
    </div>

    <!-- AR slide overlay (JS will inject content only when a valid ID is seen) -->
    <div id="info-overlay" class="hidden" aria-live="polite" aria-hidden="true"></div>

    <!-- loader spinner -->
    <div id="loader" class="hidden"></div>

    <!-- Logo + start -->
    <img id="start-logo" src="image.png" alt="EDGE Logo" />
    <button id="start-btn" class="primary">Start Scanner</button>

    <!-- Error banner -->
    <div id="scan-result" class="hidden"><p></p></div>

    <!-- Avatar container (bottom-left) -->
    <div id="avatar-container">
      <div id="avatar-loading">Loading Avatar...</div>
    </div>

    <!-- Story container (main content display) -->
    <div id="story-container" class="hidden">
      <div class="story-frame">
        <div class="story-header" id="story-header">SCAN AR</div>
        <div class="story-content">
          <div id="story-text"></div>
        </div>
        <button id="ask-question-btn" class="ask-btn hidden">Ask me any question</button>
      </div>
    </div>

    <!-- Slide image (separate from story container) -->
    <div id="slide-image-container" class="hidden">
      <img id="slide-image" src="" alt="" />
    </div>
  </div>

  <footer class="footer">
    Created by
    <a href="https://www.awaizahmed.com/" target="_blank" rel="noopener">Awaiz Ahmed</a>
  </footer>

  <script type="module" src="./script.js"></script>
</body>
</html>
