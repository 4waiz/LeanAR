<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
  <title>EDGE | 3D QR Scanner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Fullscreen camera + overlay -->
  <div id="video-container">
    <!-- Camera feed -->
    <div id="qr-reader">
      <video id="video" autoplay playsinline muted></video>
    </div>

    <!-- INFO overlay (text + image on the right) -->
    <div id="info-overlay" class="hidden" aria-live="polite">
      <div class="info-content">
        <div class="info-text">
          <h1 id="slide-title" class="outlined"></h1>
          <p class="outlined small"><span class="label">Definition:</span> <span id="slide-def"></span></p>
          <p class="outlined small"><span class="label">Description:</span> <span id="slide-desc"></span></p>
        </div>
        <div class="info-image">
          <img id="slide-image" alt="" />
        </div>
      </div>
    </div>

    <!-- loader spinner -->
    <div id="loader" class="hidden"></div>

    <!-- EDGE logo above Start -->
    <img id="start-logo" src="image.png" alt="EDGE Logo" />

    <!-- Start button (needed for camera permission) -->
    <button id="start-btn" class="primary">Start Scanner</button>

    <!-- Status only shown for errors -->
    <div id="scan-result" class="hidden"><p></p></div>
  </div>

  <!-- Footer overlay (compact; no scrolling) -->
  <footer class="footer">
    Created by
    <a href="https://www.awaizahmed.com/" target="_blank" rel="noopener">Awaiz Ahmed</a>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
