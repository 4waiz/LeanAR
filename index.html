<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EDGE | 3D QR Scanner</title>
  <link rel="stylesheet" href="style.css" />
  <!-- A-Frame in head so the scene is ready before we inject it -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
</head>
<body>
  <div id="container">
    <img src="image.png" alt="EDGE Learning & Innovation Factory Logo" class="header-logo"/>
    <h1>3D QR Scanner</h1>
    <p>Point at a QR containing <strong>ID-1</strong>, <strong>ID-2</strong>, <strong>ID-3</strong> or <strong>ID-4</strong> to see an overlay.</p>

    <div id="video-container">
      <!-- Camera feed (this is REQUIRED) -->
      <div id="qr-reader">
        <video id="video" autoplay playsinline muted></video>
      </div>

      <!-- Overlay (rendered on top of the video) -->
      <div id="model-container" aria-hidden="true"></div>

      <!-- loader spinner -->
      <div id="loader" class="hidden"></div>
    </div>

    <div id="scan-result"><p>Tap “Start Scanner” and allow camera access.</p></div>
    <button id="start-btn" class="primary">Start Scanner</button>
  </div>

  <script src="./script.js"></script>
</body>
</html>
