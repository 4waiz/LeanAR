<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
  />
  <title>EDGE | 3D QR Scanner</title>
  <link rel="stylesheet" href="style.css" />
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
</head>
<body>
  <!-- Fullscreen camera + overlay -->
  <div id="video-container">
    <!-- Camera feed -->
    <div id="qr-reader">
      <video id="video" autoplay playsinline muted></video>
    </div>

    <!-- 3D overlay (A-Frame scene is injected here) -->
    <div id="model-container" aria-hidden="true"></div>

    <!-- loader spinner -->
    <div id="loader" class="hidden"></div>

    <!-- EDGE logo above Start -->
    <img id="start-logo" src="image.png" alt="EDGE Logo" />

    <!-- Start button (needed for camera permission) -->
    <button id="start-btn" class="primary">Start Scanner</button>

    <!-- Status only shown for errors -->
    <div id="scan-result" class="hidden"><p></p></div>
  </div>

  <!-- Footer overlay (does not cause scrolling) -->
  <footer class="footer">
    Created by
    <a href="https://www.awaizahmed.com/" target="_blank" rel="noopener">Awaiz Ahmed</a>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
