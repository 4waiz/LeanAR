<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EDGE | 3D QR Scanner</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>

</head>
<body>
  <div id="container">
    <img src="image.png" alt="Edge Learning & Innovation Factory Logo" class="header-logo"/>
    <h1>3D QR Scanner</h1>
    <p>Point at a QR containing <strong>ID-1</strong> or <strong>ID-2</strong> to see an overlay.</p>

    <div id="video-container">
      <!-- Camera feed -->
      <div id="qr-reader"></div>

      <!-- 3D overlay (on top of the camera) -->
      <div id="model-container" aria-hidden="true"></div>

      <!-- loader spinner -->
      <div id="loader" class="hidden"></div>
    </div>

    <div id="scan-result"><p>Tap “Start” and allow camera access.</p></div>

    <!-- Explicit start for iOS / permission flow -->
    <button id="start-btn" class="primary">Start Scanner</button>
  </div>

  <script src="./script.js"></script>
</body>
</html>
