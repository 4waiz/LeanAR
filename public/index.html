<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
  <!-- Prevent all caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>EDGE | LeanAR</title>
  <link rel="stylesheet" href="css/style.css?v=2" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="video-container">
    <!-- Camera feed -->
    <div id="qr-reader">
      <video id="video" autoplay playsinline muted></video>
    </div>

    <!-- AR slide overlay (JS will inject content only when a valid ID is seen) -->
    <div id="info-overlay" class="hidden" aria-live="polite" aria-hidden="true"></div>

    <!-- loader spinner -->
    <div id="loader" class="hidden"></div>

    <!-- Logo + start -->
    <img id="start-logo" src="assets/images/image.svg" alt="EDGE Logo" />
    <button id="start-btn" class="primary">Start Scanner</button>

    <!-- Error banner -->
    <div id="scan-result" class="hidden"><p></p></div>

    <!-- Avatar container (bottom-left) -->
    <div id="avatar-container">
      <div id="avatar-loading">Loading Avatar...</div>
    </div>

    <!-- Story container (main content display) -->
    <div id="story-container" class="hidden">
      <div class="story-frame">
        <div class="story-header" id="story-header">LEANAR</div>
        <div class="story-content">
          <div id="story-text"></div>
        </div>
        <button id="ask-question-btn" class="ask-btn hidden">Ask me any question</button>
      </div>
    </div>

    <!-- Slide image (separate from story container) -->
    <div id="slide-image-container" class="hidden">
      <button id="mute-btn" class="mute-btn" aria-label="Mute voice">
        <svg id="mute-icon-on" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <svg id="mute-icon-off" class="hidden" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
      </button>
      <img id="slide-image" src="" alt="" />
    </div>

    <!-- Fullscreen image overlay -->
    <div id="fullscreen-image-overlay" class="hidden">
      <button id="close-fullscreen-btn" class="close-fullscreen-btn" aria-label="Close fullscreen">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
      <img id="fullscreen-image" src="" alt="" />
    </div>
  </div>

  <footer class="footer">
    Created by
    <a href="https://www.awaizahmed.com/" target="_blank" rel="noopener">Awaiz Ahmed</a>
  </footer>

  <script type="module" src="./js/script.js?v=2"></script>
</body>
</html>
